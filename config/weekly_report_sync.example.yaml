# ==============================================================================
# hMailServer Event -> SeedDMS 自动归档配置模板
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. hMailServer Event 接入
# ------------------------------------------------------------------------------
hmail_event:
  enabled: true

  # EventHandlers.vbs 会先把 oMessage.Filename 复制到这个目录。
  # 如果使用相对路径，则相对于 devops-tools 项目根目录。
  # EventHandlers.vbs 中建议填写对应的绝对路径。
  queue_dir: "./data/mail_event_queue"

  # hMailServer 调用 POST /event/hmailserver 时使用。
  # 必须与 scripts/hmailserver/EventHandlers.example.vbs 中 DEVOPS_EVENT_KEY 一致。
  api_key: "replace-with-a-long-random-event-api-key"

  # 默认只接受 127.0.0.1 / ::1 的事件通知。
  allow_remote: false

  # 正常情况下 Event HTTP 通知会立即唤醒消费者；
  # 此间隔仅用于服务启动时遗留队列和 SeedDMS 上传失败后的自动重试。
  retry_interval_seconds: 30

# ------------------------------------------------------------------------------
# 2. 周报邮件匹配与附件提取规则
# ------------------------------------------------------------------------------
filter_rules:
  # 建议明确填写真正用于发送周会/周报的邮箱。
  # OnDeliverMessage 会看到 hMailServer 的所有投递邮件，配置白名单可以避免误归档外部来信。
  allowed_senders:
    - "report_sender@company.com"

  # 主题包含关键词，或附件名本身符合归档命名规则时进入归档处理。
  subject_keywords:
    - "周会"
    - "会议纪要"

  # 最终分发邮件 To/CC 必须同时包含以下全部地址；为空表示不限制。
  required_recipients:
    - "software_group@company.com"
    - "hardware_group@company.com"

  allowed_extensions:
    - ".docx"
    - ".doc"
    - ".xlsx"
    - ".xls"
    - ".pptx"
    - ".pdf"
    - ".zip"

# ------------------------------------------------------------------------------
# 3. SeedDMS 知识库归档
# ------------------------------------------------------------------------------
seeddms:
  enabled: true
  api_url: "http://seeddms.example.com:8080"
  username: "your_username"
  password: "your_password"
  target_folder_id: 24
  auto_create_year_folder: true
  document_name_template: "{filename}"
  comment: "由 hMailServer Event 自动捕获并归档"

# ------------------------------------------------------------------------------
# 4. 归档完成邮件通知
# ------------------------------------------------------------------------------
notification:
  enabled: true
  smtp_host: "127.0.0.1"
  smtp_port: 25
  use_ssl: false
  starttls: false

  # SMTP 登录账号，已不再依赖 IMAP 配置。
  username: "report_sender@company.com"
  password: "your_email_password"
  recipient: "report_sender@company.com"
  subject: "周会纪要自动归档完成"

# ------------------------------------------------------------------------------
# 5. HTTP 手工消费队列
# ------------------------------------------------------------------------------
manual_trigger:
  enabled: true
  # POST /sync/weekly_report 请求头：X-API-Key: <此值>
  api_key: "replace-with-a-long-random-manual-api-key"

# ------------------------------------------------------------------------------
# 6. 本地缓存与 JSON 状态
# ------------------------------------------------------------------------------
storage:
  temp_dir: "./data/temp_attachments"
  history_file: "./data/processed_emails.json"

  # Event 模式状态格式不兼容之前的 IMAP UID 状态。
  # 切换到 Event 模式部署时直接删除旧 processed_emails.json 即可。
